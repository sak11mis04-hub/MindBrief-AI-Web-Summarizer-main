<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBrief</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020817, #111827 45%, #0f172a);
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(900px, 90vw);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 {
      margin-top: 0;
      color: #c4b5fd;
      font-size: clamp(2rem, 4vw, 3rem);
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-weight: 600;
    }
    textarea, input, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #475569;
      padding: 12px 14px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    textarea {
      min-height: 180px;
      resize: vertical;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
    }
    input, select {
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
    }
    button {
      margin-top: 18px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .small {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>MindBrief</h1>
    <p class="small">AI-powered text summarizer with article URL support</p>

    <form action="/summarize" method="post">
      <label for="text">Paste text</label>
      <textarea id="text" name="text" placeholder="Paste long text here..."></textarea>

      <label for="url">Or enter a URL</label>
      <input id="url" name="url" placeholder="https://example.com/article" />

      <label for="method">Summarization method</label>
      <select id="method" name="method">
        <option value="extractive">Extractive (Offline)</option>
        <option value="ai">AI-Powered</option>
      </select>

      <button type="submit">Generate Summary</button>
    </form>
  </div>
</body>
</html>
